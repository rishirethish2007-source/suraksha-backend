name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: suraksha
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: suraksha
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U suraksha" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql+asyncpg://suraksha:local-test-only@localhost:5432/suraksha
      TEST_DATABASE_URL: postgresql+asyncpg://suraksha:local-test-only@localhost:5432/suraksha
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: python -m pytest -q
      - run: alembic upgrade head --sql > migration.sql
